<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skipjack GPU Usage</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --track: #e8e7e1; --wash: rgba(11,11,11,0.04);
  --tier-high: #2a78d6; --tier-mid: #eb6834; --tier-low: #1baf7a; --total: #52514e; --cap: #b3b1a8;
  --s1: #2a78d6; --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --good-text: #006300; --crit-text: #b3261e; --chip: #efeee9;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --track: #2c2c2a; --wash: rgba(255,255,255,0.05);
    --tier-high: #3987e5; --tier-mid: #d95926; --tier-low: #199e70; --total: #c3c2b7; --cap: #5d5c57;
    --s1: #3987e5; --good-text: #0ca30c; --crit-text: #e66767; --chip: #262624;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --track: #2c2c2a; --wash: rgba(255,255,255,0.05);
  --tier-high: #3987e5; --tier-mid: #d95926; --tier-low: #199e70; --total: #c3c2b7; --cap: #5d5c57;
  --s1: #3987e5; --good-text: #0ca30c; --crit-text: #e66767; --chip: #262624;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 20px 24px 8px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; font-weight: 600; }
h2 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
h3 { font-size: 14px; margin: 16px 0 6px; font-weight: 600; }
.sub { color: var(--ink-2); font-size: 13px; margin: 2px 0 0; }
.muted { color: var(--muted); }
nav { display: flex; gap: 4px; padding: 0 24px; border-bottom: 1px solid var(--grid); overflow-x: auto; }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--ink-2); padding: 10px 12px; font: inherit; cursor: pointer; white-space: nowrap; }
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
nav button:hover { color: var(--ink); }
main { padding: 16px 24px 48px; max-width: 1500px; }
.filters { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 4px 0 16px; }
.filters label { color: var(--ink-2); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
input[type=search], select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
input[type=search] { width: 220px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; border: 0; background: var(--surface); color: var(--ink-2); padding: 5px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--wash); color: var(--ink); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.card .sub { margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .label { color: var(--ink-2); font-size: 13px; }
.tile .value { font-size: 26px; font-weight: 600; margin-top: 2px; }
.tile .note { color: var(--muted); font-size: 12px; }
.tile.hero .value { font-size: 48px; line-height: 1.1; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin: 4px 0 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.lkey { width: 14px; height: 2px; display: inline-block; border-radius: 1px; }
.hatch { background: repeating-linear-gradient(135deg, var(--axis) 0 2px, transparent 2px 5px); }
.brow { display: grid; grid-template-columns: 170px 1fr 190px; gap: 10px; align-items: center; padding: 5px 0; }
.brow .name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brow.wide { grid-template-columns: 250px 1fr 150px; }
.brow .name small { display: block; color: var(--muted); font-size: 11px; }
.brow .val { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bar { display: flex; gap: 2px; height: 14px; }
.bar > div { height: 100%; min-width: 0; }
.bar > div:last-child { border-radius: 0 4px 4px 0; }
.bar > div:hover { filter: brightness(1.12); }
.chip { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--chip); color: var(--ink-2); margin-left: 6px; vertical-align: 1px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--grid); vertical-align: middle; white-space: nowrap; }
td.wrap { white-space: normal; min-width: 150px; max-width: 260px; }
figure.inline { margin: 0; }
th { color: var(--ink-2); font-weight: 600; font-size: 12px; white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--ink); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--wash); }
tr.detail td { background: var(--wash); }
.tablewrap { overflow-x: auto; }
.meter { display: inline-flex; align-items: center; gap: 8px; }
.meter .track { width: 56px; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.meter .fill { height: 100%; border-radius: 4px; }
.mini { display: inline-flex; gap: 2px; height: 10px; width: 110px; vertical-align: middle; margin-right: 8px; }
.mini > div { height: 100%; }
.mini > div:last-child { border-radius: 0 3px 3px 0; }
.badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 9px; white-space: nowrap; }
.badge.high { color: var(--crit-text); background: color-mix(in srgb, var(--critical) 14%, transparent); }
.badge.medium { color: var(--ink); background: color-mix(in srgb, var(--warning) 28%, transparent); }
.badge.info { color: var(--ink-2); background: var(--chip); }
.finding { border-left: 3px solid var(--axis); }
.finding.high { border-left-color: var(--critical); }
.finding.medium { border-left-color: var(--warning); }
.finding p { max-width: 900px; }
code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--chip); padding: 1px 4px; border-radius: 4px; }
details summary { cursor: pointer; color: var(--ink-2); font-size: 13px; margin-top: 8px; }
dl.gloss dt { font-weight: 600; margin-top: 10px; }
dl.gloss dd { margin: 2px 0 0; color: var(--ink-2); max-width: 900px; }
#banner .stale { margin: 8px 24px 0; padding: 10px 14px; border-radius: 8px; border-left: 3px solid var(--warning);
  background: color-mix(in srgb, var(--warning) 14%, transparent); font-size: 14px; }
#tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--ink); border: 1px solid var(--border);
  box-shadow: 0 4px 16px rgba(0,0,0,0.12); border-radius: 8px; padding: 8px 10px; font-size: 12px; display: none; min-width: 140px; }
#tip .t { color: var(--ink-2); margin-bottom: 4px; }
#tip .r { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
#tip .r b { font-variant-numeric: tabular-nums; }
.chart svg { display: block; width: 100%; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.loading { opacity: 0.6; transition: opacity .2s; }
.warn { color: var(--crit-text); }
.flag { font-size: 12px; color: var(--crit-text); }
.explain { max-width: 950px; color: var(--ink-2); }
.explain b { color: var(--ink); }
.showmore { margin-top: 8px; font: inherit; background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; color: var(--ink-2); cursor: pointer; }
button.theme { font: inherit; background: var(--surface); border: 1px solid var(--border); color: var(--ink-2); border-radius: 6px; padding: 5px 10px; cursor: pointer; }

.plan-in { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
.plan-in .grp { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2); }
.plan-in input[type=number] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; width: 90px; }
.mixrow { display: grid; grid-template-columns: 70px 1fr 60px 150px; gap: 10px; align-items: center; padding: 4px 0; font-size: 13px; }
.mixrow input[type=range] { width: 100%; accent-color: var(--s1); }
.need { position: relative; height: 14px; }
.need .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--s1); }
.need .ref { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.big { font-size: 32px; font-weight: 600; line-height: 1.15; }
.tile.wide { grid-column: span 2; }
.card p, .card li, .card h2, .card h3, dl.gloss dd { overflow-wrap: anywhere; }
.tile.wide .big { font-size: 28px; }
.need .clip { position: absolute; right: -2px; top: -1px; font-size: 12px; line-height: 16px; color: var(--ink-2); }
.callout { border-left: 3px solid var(--critical); padding: 4px 12px; margin: 8px 0; }
.callout.ok { border-left-color: var(--s1); }
ul.tight { margin: 6px 0; padding-left: 20px; } ul.tight li { margin: 4px 0; max-width: 950px; }
body.present { font-size: 16px; }
body.present header .sub, body.present .filters label { font-size: 15px; }
body.present .tile .value { font-size: 34px; } body.present .big { font-size: 40px; }
body.present table { font-size: 15px; }
@media (max-width: 700px) {
  header, nav, main { padding-left: 16px; padding-right: 16px; }
  .brow { grid-template-columns: 110px 1fr 90px; }
  .grid2 { grid-template-columns: 1fr; }
  .brow.wide { grid-template-columns: 130px 1fr 80px; }
  .mixrow { grid-template-columns: 50px 1fr 44px; } .mixrow .val { display: none; }
  .tile.wide { grid-column: auto; }
  .tile.hero .value { font-size: 40px; }
  input[type=search] { width: 100%; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Skipjack GPU usage</h1>
    <p class="sub" id="updated">Loading…</p>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="theme" id="refreshBtn" type="button">Refresh now</button>
    <button class="theme" id="theme" type="button" title="Switch light / dark / system theme">Theme: system</button>
  </div>
</header>
<div id="banner"></div>
<nav id="tabs" role="tablist"></nav>
<main id="main"></main>
<div id="tip" role="tooltip"></div>

<script>window.SKJ_PUBLIC = true;</script>
<script>
"use strict";
// ---------------------------------------------------------------------------
// tiny DOM helpers (all data goes in via textContent — names come from Slurm)
// ---------------------------------------------------------------------------
const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
}
const NS = "http://www.w3.org/2000/svg";
function sv(tag, attrs, ...kids) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) e.setAttribute(k, v);
  for (const k of kids) if (k != null) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
// `code` spans in finding text -> <code>, everything else as text
function richText(s) {
  const out = [];
  String(s).split("`").forEach((part, i) => out.push(i % 2 ? el("code", {}, part) : part));
  return out;
}
const n0 = v => v == null || isNaN(v) ? "–" : Math.round(v).toLocaleString();
const n1 = v => v == null || isNaN(v) ? "–" : (Math.round(v * 10) / 10).toLocaleString();
const pl = (v, w) => `${n0(v)} ${w}${Math.round(v) === 1 ? "" : "s"}`;
const pct = (v, d = 1) => v == null || isNaN(v) ? "–" : v.toFixed(d) + "%";
const TIERS = ["high", "mid", "low"];
// GPU classes (by the cluster's own price per GPU) are named by the GPU types in them, most expensive first
const TIER_TYPES = { high: ["B300", "B200", "H200", "H100"], mid: ["A100", "RTX PRO 6000"], low: ["L40S"] };
function tierName(t) {
  const live = ((S.now && S.now.types) || []).filter(x => x.tier === t && !x.mig).sort((a, b) => (b.price_hour || 0) - (a.price_hour || 0))
    .map(x => String(x.label).replace(/ SXM$/, ""));
  return (live.length ? live : TIER_TYPES[t] || [t]).join(" / ");
}
const tierVar = t => `var(--tier-${t})`;
function bytes(n) {
  if (n == null) return "–";
  const u = ["B", "KB", "MB", "GB", "TB", "PB"]; let i = 0;
  while (Math.abs(n) >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return (n >= 100 || i === 0 ? Math.round(n) : n.toFixed(1)) + " " + u[i];
}
function ago(ts) {
  const s = Math.round(Date.now() / 1000 - ts);
  return s < 90 ? s + " s ago" : Math.round(s / 60) + " min ago";
}
function mixText(mix) {
  return Object.entries(mix || {}).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1])
    .map(([g, v]) => `${g} ${n1(v)}`).join(" · ") || "–";
}
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

// ---------------------------------------------------------------------------
// tooltip
// ---------------------------------------------------------------------------
const tip = $("#tip");
function showTip(ev, title, rows) {
  tip.replaceChildren(el("div", { class: "t" }, title),
    ...rows.map(([color, label, value]) => el("div", { class: "r" },
      el("span", {}, color ? el("span", { class: "lkey", style: `background:${color};margin-right:6px` }) : null, label),
      el("b", {}, value))));
  tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.display = "none"; };

// ---------------------------------------------------------------------------
// chart pieces
// ---------------------------------------------------------------------------
// horizontal stacked bar made of divs; segs = [{v, color, label, hatch}]
function hbar(segs, max, title) {
  const bar = el("div", { class: "bar" });
  for (const s of segs) {
    if (!(s.v > 0)) continue;
    const d = el("div", { class: s.hatch ? "hatch" : "", style: `flex:0 1 max(3px, calc(${100 * s.v / max}% - 2px));${s.hatch ? "" : "background:" + s.color}`, tabindex: "0" });
    const rows = segs.filter(x => x.v > 0).map(x => [x.hatch ? "var(--axis)" : x.color, x.label, n1(x.v)]);
    d.addEventListener("pointermove", e => showTip(e, title, rows));
    d.addEventListener("pointerleave", hideTip);
    d.addEventListener("focus", e => { const r = d.getBoundingClientRect(); showTip({ clientX: r.right, clientY: r.top }, title, rows); });
    d.addEventListener("blur", hideTip);
    bar.append(d);
  }
  return bar;
}
function miniTiers(tiers, max) {
  const m = el("span", { class: "mini" });
  for (const t of TIERS) if (tiers[t] > 0) m.append(el("div", { style: `flex:0 0 max(2px, calc(${100 * tiers[t] / max}% - 2px));background:${tierVar(t)}` }));
  return m;
}
function meter(p, label) {
  if (p == null) return el("span", { class: "muted" }, label || "no limit");
  const color = p >= 95 ? "var(--critical)" : p >= 80 ? "var(--warning)" : "var(--s1)";
  const word = p >= 99.5 ? " full" : p >= 80 ? " near" : "";
  return el("span", { class: "meter" },
    el("span", { class: "track" }, el("span", { class: "fill", style: `display:block;width:${Math.min(p, 100)}%;background:${color}` })),
    el("span", { class: p >= 95 ? "warn" : "", title: p >= 99.5 ? "main-account allowance used up" : p >= 80 ? "main account near its allowance" : "" }, (p >= 95 ? "▲ " : "") + pct(p, 0) + word));
}
function sparkline(vals, w = 96, h = 22) {
  const s = sv("svg", { viewBox: `0 0 ${w} ${h}`, width: w, height: h, "aria-hidden": "true" });
  if (!vals || !vals.length) return s;
  const max = Math.max(1, ...vals);
  const pts = vals.map((v, i) => [2 + i * (w - 6) / Math.max(1, vals.length - 1), h - 3 - (v / max) * (h - 6)]);
  s.append(sv("polyline", { points: pts.map(p => p.join(",")).join(" "), fill: "none", stroke: "var(--muted)", "stroke-width": 1.5, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  const [lx, ly] = pts[pts.length - 1];
  s.append(sv("circle", { cx: lx, cy: ly, r: 2.5, fill: "var(--s1)" }));
  return s;
}
function axisNum(v) {
  return v >= 1e6 ? (v / 1e6).toLocaleString(undefined, { maximumFractionDigits: 1 }) + "M"
    : v >= 1e4 ? (v / 1e3).toLocaleString(undefined, { maximumFractionDigits: 1 }) + "k" : n0(v);
}
function niceMax(v) {
  if (v <= 0) return 10;
  const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p;
  return ([1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find(x => f <= x) || 10) * p;
}
// multi-line time series with crosshair tooltip. series: [{key,label,color,width}]
function lineChart(box, data, series, hours) {
  box.replaceChildren();
  const W = Math.max(320, box.clientWidth || 700), H = 260, m = { l: 44, r: 12, t: 10, b: 26 };
  const ts = data.ts || [];
  if (!ts.length) { box.append(el("p", { class: "muted" }, "No history yet — it fills in every 5 minutes.")); return; }
  const vals = series.map(s => data.series[s.key] || []);
  const ymax = niceMax(Math.max(1, ...vals.flat().filter(v => v != null)));
  m.l = Math.max(44, 14 + 7 * Math.max(...[0, 1, 2, 3, 4].map(k => axisNum(ymax * k / 4).length)));
  const x = i => m.l + (W - m.l - m.r) * (ts[i] - ts[0]) / Math.max(1, ts[ts.length - 1] - ts[0]);
  const y = v => m.t + (H - m.t - m.b) * (1 - v / ymax);
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "GPUs in use over time" });
  for (let k = 0; k <= 4; k++) {
    const v = ymax * k / 4, yy = y(v);
    svg.append(sv("line", { x1: m.l, x2: W - m.r, y1: yy, y2: yy, stroke: k ? "var(--grid)" : "var(--axis)", "stroke-width": 1 }));
    svg.append(sv("text", { x: m.l - 6, y: yy + 4, "text-anchor": "end" }, axisNum(v)));
  }
  const span = ts[ts.length - 1] - ts[0], nt = Math.min(7, Math.floor((W - m.l) / 90));
  for (let k = 0; k <= nt; k++) {
    const t = ts[0] + span * k / nt, d = new Date(t * 1000);
    const lab = hours <= 24 ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
      : d.toLocaleDateString([], { month: "short", day: "numeric" }) + (hours <= 72 ? " " + d.getHours() + "h" : "");
    const xx = m.l + (W - m.l - m.r) * k / nt;
    svg.append(sv("text", { x: xx, y: H - 8, "text-anchor": k === 0 ? "start" : k === nt ? "end" : "middle" }, lab));
  }
  series.forEach((s, si) => {
    let d = "", pen = false;
    vals[si].forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1); pen = true; });
    svg.append(sv("path", { d, fill: "none", stroke: s.color, "stroke-width": s.width || 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  });
  const cross = sv("line", { y1: m.t, y2: H - m.b, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" });

// Locked lab pages on the public site: data/lab/<id>.json, encrypted with the lab's access code
// (PBKDF2-SHA256 -> AES-256-GCM, see seal() in skj_public.py). The code never leaves the browser.
// ---------------------------------------------------------------------------

    { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

}

  const BK = M.by_kind || { main: { credits: M.total, gpu_hours: M.gpu_hours } };
  const mainC = (BK.main || {}).credits || 0;
  const projK = ["project", "condo"].filter(k => BK[k]);
  const projGH = projK.reduce((a, k) => a + BK[k].gpu_hours, 0), projC = projK.reduce((a, k) => a + BK[k].credits, 0);
  const capAll = ((S.alloc && S.alloc.pis ? S.alloc.pis.find(p => p.pi === L.pi) : null) || {}).gpus_at_once || 0;
  const who = u => u;
  const card = el("div", { class: "card" },
    el("h2", {}, `Where the lab's ${hasP ? "GPU time" : "credits"} went — ${M.label}`),
    el("div", { class: "filters" }, el("div", { class: "seg" }, ["d7", "d30", "month", "prev"].filter(k => MW[k]).map(k =>
      el("button", { "aria-pressed": String(k === ui.monthWin), onclick: () => { ui.monthWin = k; render(); } }, MW[k].label)))),
    el("p", { class: "sub" }, "Private view (this dashboard only). " +
      (hasP ? "Only the main account has a monthly allowance; the project/condo accounts are limited by GPUs at once, so their use is shown in GPU-hours. " : "") +
      `Credits are counted at today's prices (GPU price × GPUs × minutes)${L.month.change_date ? `; jobs before ${L.month.change_date} were billed far less at the time, so this shows what the same work costs now` : ""}.`));
  if (!M.total) { card.append(el("p", { class: "muted" }, "No jobs on this lab's accounts in this period.")); return card; }
  const mainPerDay = mainC / Math.max(M.days, 1 / 24);
  const daysLeft = full && mainPerDay ? full / mainPerDay : null;
  const lasts = daysLeft == null ? "" : daysLeft > 31 ? " — at this pace it will not run out this month" : ` — at this pace a month's main allowance lasts about ${n1(daysLeft)} days`;
  const top = M.members[0];
  const tile = (label, value, note) => el("div", { class: "tile" }, el("div", { class: "label" }, label), el("div", { class: "value" }, value), el("div", { class: "note" }, note));
  const mainWord = "Main account";
  card.append(el("div", { class: "tiles" },
    M.calendar ? el("div", { class: "tile hero" }, el("div", { class: "label" }, `${mainWord}: used of the ${M.label.startsWith("This") ? "month's" : M.label} allowance`), el("div", { class: "value", style: "font-size:40px" }, pct(100 * mainC / Math.max(allow, 1), 0)),
      el("div", { class: "note" }, `${n0(mainC)} of ${n0(allow)} credits in ${n1(M.days)} days` + (hasP ? "" : ` · ${n0(M.gpu_hours)} GPU-hours`) + lasts))
    : el("div", { class: "tile hero" }, el("div", { class: "label" }, `${mainWord}: used vs. the allowance for ${n0(M.days)} days`), el("div", { class: "value", style: "font-size:40px" }, `${n1(mainC / Math.max(allow, 1))}×`),
      el("div", { class: "note" }, `${n0(mainC)} credits` + (hasP ? "" : ` (${n0(M.gpu_hours)} GPU-hours)`) + ` vs ${n0(allow)} pro-rated` + lasts)),
    hasP ? tile("On project/condo accounts", `${n0(projGH)} GPU-h`, `${pct(100 * projGH / Math.max(M.gpu_hours, 1), 0)} of the lab's GPU-hours · no hour limit · ${n0(projC)} credits' worth`) : null,
    tile("Used by the top member", pct(top.pct, 0), M.members.length > 1 ? `the other ${M.members.length - 1} together: ${pct(100 - top.pct, 0)}` : "only one member ran jobs"),
    tile("Spent in interactive sessions", pct(P.interactive_pct, 0), "srun / salloc shells and VS Code, rather than batch jobs"),
    tile("Sessions holding 4+ GPUs", pct(P.big_pct, 0), `${P.big_sessions} session(s) — a whole node of GPUs at once`),
    tile("Ran until their time limit", pct(P.ran_to_limit_pct, 0), "ended only because time ran out — often a window left open"),
    tile("No activity recorded", pct(P.idle_pct, 0), `${P.idle_sessions} finished session(s) where Slurm recorded no work in the session's shell. Work over VS Code/ssh and GPU use are not recorded, so this can overcount — ask, don't assume`),
    P.ended_at_cap_jobs ? tile("Jobs ended at the limit", n0(P.ended_at_cap_jobs), "stopped by Slurm when the main account went over its allowance") : null,
    P.peak_gpus ? tile("Most GPUs held at once", `${P.peak_gpus} GPUs`, hasP
      ? `${P.peak_proj_gpus || 0} of them on project/condo accounts` + (capAll ? `, whose cap is ${capAll}` : "")
      : P.peak_rate_hour ? `at the busiest moment the lab was spending ${n0(P.peak_rate_hour)} credits an hour — the main account's monthly allowance would last ${n1(full / P.peak_rate_hour)} hours` : "") : null));

  // burn curve: main-account credits against its allowance (the only account with one)
  const box = el("div", { class: "chart" });
  const ts = M.burn.map(b => b[0]);
  const data = { ts, series: { used: M.burn.map(b => b.length > 3 ? b[3] : b[1]), allow: M.burn.map(b => b[2]) } };
  const ser = [{ key: "allow", label: M.calendar ? "Main-account monthly allowance" : "Main-account allowance, pro-rated over the period", color: "var(--cap)", width: 1.5 },
    { key: "used", label: "Main-account credits used (today's prices)", color: "var(--s1)" }];
  card.append(el("h3", {}, `Main-account credits — ${M.label}`), legend(ser.map(x => [x.color, x.label, "line"])), box,
    hasP ? el("p", { class: "sub" }, `Not on the chart: ${n0(projC)} credits' worth (${n0(projGH)} GPU-hours) on the project/condo accounts, which have no monthly allowance.`) : null);
  requestAnimationFrame(() => lineChart(box, data, ser, Math.max(24, (ts[ts.length - 1] - ts[0]) / 3600)));

  // member shares: top three + everyone else
  const parts = M.members.slice(0, 3).map((m, i) => ({ v: m.credits, color: ["var(--tier-high)", "var(--tier-mid)", "var(--tier-low)"][i], label: who(m.user) }));
  const rest = M.members.slice(3).reduce((a, m) => a + m.credits, 0);
  if (rest > 0) parts.push({ v: rest, color: "var(--muted)", label: `Everyone else (${M.members.length - 3})` });
  card.append(el("h3", {}, "Share of the period's credits (all accounts)"), legend(parts.map(x => [x.color, `${x.label} · ${pct(100 * x.v / M.total, 0)}`])),
    hbar(parts, M.total, "Share of the period's credits"),
    det("Members in this period", sortTable([{ key: "user", label: "Member", render: r => who(r.user) },
      { key: "credits", label: "Credits (today's prices)", num: true, render: r => n0(r.credits) }, { key: "pct", label: "Share", num: true, render: r => pct(r.pct, 1) },
      { key: "gpu_hours", label: "GPU-hours", num: true, render: r => n0(r.gpu_hours) }]
      .concat(hasP ? [{ key: "proj_gpu_hours", label: "…on project/condo", num: true, render: r => n0(r.proj_gpu_hours || 0) },
        { key: "main_credits", label: "Main-account credits", num: true, render: r => n0(r.main_credits || 0) }] : [])
      .concat([{ key: "jobs", label: "Jobs", num: true },
        { key: "interactive_pct", label: "Interactive share", num: true, render: r => pct(r.interactive_pct, 0) }]), M.members, { id: "month-members", sortKey: "credits" })));

  // largest sessions
  const onMain = r => !r.acct_kind || r.acct_kind === "main";
  const ended = r => r.state === "RUNNING" ? "still running" : r.ended_at_cap ? "stopped when the main account hit its limit" : r.ran_to_limit ? `ran until its ${n1(r.limit_h)} h limit`
    : r.state === "CANCELLED" ? "closed / cancelled" : r.state === "COMPLETED" ? "finished" : r.state.toLowerCase();
  const act = r => r.cpu_eff == null ? "not known yet" : r.cpu_eff < 0.01 ? "none recorded*" : r.cpu_eff < 0.1 ? "low" : "normal";
  card.append(el("h3", {}, "Largest sessions in this period"), sortTable([
    { key: "user", label: "Member", render: r => who(r.user) },
    hasP ? { key: "acct", label: "Account", render: r => r.acct || "–" } : null,
    { key: "start", label: "Started", render: r => new Date(r.start * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) },
    { key: "kind", label: "Type" },
    { key: "gpus", label: "GPUs", num: true, render: r => r.gpus ? `${r.gpus} × ${(r.gtype || "").toUpperCase()}` : "CPU only" },
    { key: "hours", label: "Hours", num: true, render: r => n1(r.hours) },
    { key: "credits", label: "Credits", num: true, render: r => n0(r.credits) },
    { key: "pa", label: "% of main allowance", num: true, sort: r => onMain(r) ? r.credits : -1, render: r => onMain(r) ? pct(100 * r.credits / Math.max(allow, 1)) : el("span", { class: "muted" }, "project — no limit") },
    { key: "state", label: "How it ended", render: ended },
    { key: "cpu_eff", label: "CPU activity", render: act },
  ].filter(Boolean), M.sessions, { id: "month-sessions", sortKey: "credits", limit: 10 }),
    el("p", { class: "sub" }, "* Slurm records CPU work done inside the session's own shell only; work done over VS Code or ssh into the node, and GPU use, are not recorded on this cluster."));

  // what the patterns cost
  const big = M.sessions[0];
  const idle = M.sessions.filter(r => r.cpu_eff != null && r.cpu_eff < 0.01 && r.hours > 1);
  const idleSaved = idle.reduce((a, r) => a + r.credits * (1 - 1 / r.hours), 0);
  const idleGH = idle.reduce((a, r) => a + r.gpus * (r.hours - 1), 0);
  const share1 = full / Math.max(1, planState().members || L.members);
  const bigGH = big ? big.gpus * big.hours : 0;
  card.append(el("div", { class: "callout ok" }, el("ul", { class: "tight" },
    big && big.gpus ? el("li", {}, onMain(big)
      ? `The largest session (${big.gpus} × ${(big.gtype || "").toUpperCase()} for ${n1(big.hours)} h, on the main account) costs ${n0(big.credits)} credits at today's prices — ${pct(100 * big.credits / Math.max(full, 1), 0)} of a month's allowance` + (hasP ? "." : `, or ${n1(big.credits / share1)} members' fair shares.`)
      : `The largest session (${big.gpus} × ${(big.gtype || "").toUpperCase()} for ${n1(big.hours)} h) ran on ${big.acct}, which has no hour limit: ${n0(bigGH)} GPU-hours` +
        (usd[big.gtype] ? `, $${n0(bigGH * usd[big.gtype])} at ARCH's implied prices if project accounts are billed.` : ".")) : null,
    idleSaved > 0 ? el("li", {}, `If the sessions with no recorded activity really were idle, closing them after their first hour would have freed about ${n0(idleGH)} GPU-hours (${n0(idleSaved)} credits` +
      (hasP ? ")." : `, ${pct(100 * idleSaved / Math.max(full, 1), 0)} of a month's allowance).`)) : null,
    el("li", {}, "Ask only for the GPUs you will use: each GPU in an interactive session is held (and billed) every minute, busy or not."),
    el("li", {}, "Give interactive sessions short time limits (e.g. -t 2:00:00) and exit when done; run long work as batch jobs."),
    el("li", {}, hasP ? "Check the main account (pibudget) before starting anything big on it; project accounts have no allowance to run out." : "Check the main account's allowance (pibudget) before starting anything with 4+ GPUs."))));
  return card;
}

function vStorage() {
  const st = S.slow && S.slow.storage, ui = S.ui;
  if (!st || !st.rows) return el("p", { class: "muted" }, "Storage numbers load a minute after the dashboard starts.");
  const me = myLab();
  const TB = 1e12;
  const rows = st.rows.map(r => {
    const total = (r.scratch_quota || 0) + (r.proj_size || 0);
    const used = (r.scratch_used || 0) + (r.proj_used || 0);
    return { ...r, total, used, upct: total ? 100 * used / total : null, sp: r.scratch_quota ? 100 * r.scratch_used / r.scratch_quota : null,
      pp: r.proj_size ? 100 * r.proj_used / r.proj_size : null, noq: r.scratch_dir && r.scratch_quota == null,
      per: r.members ? total / r.members : null };
  });
  ui.stScope = ui.stScope || "jhu";
  const scoped = rows.filter(r => ui.stScope === "all" || (ui.stScope === "jhu" ? r.top === "jhu" || !r.is_pi : r.top !== "jhu" && r.is_pi));
  const mine = rows.find(r => r.name === me);
  const withP = scoped.filter(r => r.proj_size);
  const tot = scoped.reduce((a, r) => a + r.total, 0);
  const sorted = scoped.slice().sort((a, b) => b.total - a.total);
  const rank = mine ? sorted.indexOf(mine) + 1 : null;
  const tile = (label, value, note) => el("div", { class: "tile" }, el("div", { class: "label" }, label), el("div", { class: "value" }, value), el("div", { class: "note" }, note));

  const intro = el("div", { class: "card" }, el("h2", {}, "Storage per lab: scratch + project filesystem"),
    el("p", { class: "explain" }, "Every PI gets a scratch directory (/weka/scratch/…/PI; ARCH's default is 1 TB, often raised to 10 TB on request). A PI who needs more asks for a ",
      el("b", {}, "project filesystem"), " (/weka/projects/PI), sized per request. Storage belongs to the PI, not to individual project accounts: none of the ",
      "project/condo accounts has storage of its own, so a lab's total is its scratch plus its project filesystem. Members' home directories (100 GB each) are personal and shown separately."),
    el("div", { class: "filters" }, el("div", { class: "seg" }, [["jhu", "JHU labs"], ["ssci", "Schmidt labs"], ["all", "All"]].map(([k, l]) =>
      el("button", { "aria-pressed": String(k === ui.stScope), onclick: () => { ui.stScope = k; render(); } }, l)))),
    el("div", { class: "tiles" },
      tile("Storage allocated to these labs", `${n0(tot / TB)} TB`, `${n0(scoped.length)} labs/directories`),
      tile("Labs with a project filesystem", `${withP.length}`, `of ${scoped.filter(r => r.is_pi).length}; they hold ${pct(100 * withP.reduce((a, r) => a + r.total, 0) / Math.max(tot, 1), 0)} of the total`),
      tile("Typical lab", `${bytes(sorted.length ? sorted[Math.floor(sorted.length / 2)].total : 0)}`, "median total allocation"),
      mine ? tile(`${me}`, bytes(mine.total), `${rank ? "rank " + rank + " of " + sorted.length : ""} · ${pct(mine.upct, 0)} used · ${bytes(mine.per)} per person`) : null));

  // stacked bars: top labs by total (+ this lab)
  let top = sorted.slice(0, 25);
  if (mine && !top.includes(mine) && scoped.includes(mine)) top.push(mine);
  const maxT = Math.max(1, ...top.map(r => r.total));
  const chart = el("div", { class: "card" }, el("h2", {}, "Largest storage allocations"),
    el("p", { class: "sub" }, `Bar = allocated space; the right column shows how much of it is used. ARCH's quota snapshot of ${st.asof || "?"}; project filesystems measured live.`),
    legend([["var(--s1)", "Scratch"], [tierVar("mid"), "Project filesystem"]]));
  for (const r of top) chart.append(el("div", { class: "brow", style: r.name === me ? "font-weight:600" : "" },
    el("div", { class: "name" }, r.name + (r.name === me ? " (your lab)" : ""), el("small", {}, `${r.dept || "no Slurm account"} · ${r.members || 0} people · ${r.n_proj || 0} project accounts`)),
    hbar([{ v: r.scratch_quota || 0, color: "var(--s1)", label: "Scratch (TB)" }, { v: r.proj_size || 0, color: tierVar("mid"), label: "Project filesystem (TB)" }].map(x => ({ ...x, v: x.v / TB })), maxT / TB, r.name),
    el("div", { class: "val" }, `${bytes(r.total)} · ${pct(r.upct, 0)} used`)));

  // table
  const search = el("input", { type: "search", "data-k": "sSearch", placeholder: "Search lab…", value: ui.sSearch || "", "aria-label": "Search storage", oninput: e => { ui.sSearch = e.target.value; redraw(); } });
  const flagChk = el("input", { type: "checkbox", checked: !!ui.sFlag, onchange: e => { ui.sFlag = e.target.checked; redraw(); } });
  const holder = el("div");
  function redraw() {
    const q = (ui.sSearch || "").toLowerCase();
    const rs = scoped.filter(r => (!q || (r.name + " " + r.dept).toLowerCase().includes(q)) && (!ui.sFlag || r.noq || (r.sp || 0) >= 90 || (r.pp || 0) >= 90));
    holder.replaceChildren(sortTable([
      { key: "name", label: "Lab", render: r => r.name === me ? el("b", {}, r.name) : r.name }, { key: "dept", label: "Dept" },
      { key: "scratch_quota", label: "Scratch", num: true, render: r => r.noq ? el("span", { class: "warn" }, "no limit") : bytes(r.scratch_quota) },
      { key: "sp", label: "Scratch used", num: true, render: r => r.noq ? bytes(r.scratch_used) : meter(r.sp, "–") },
      { key: "proj_size", label: "Project FS", num: true, render: r => bytes(r.proj_size) },
      { key: "pp", label: "Project used", num: true, render: r => meter(r.pp, "–") },
      { key: "total", label: "Total", num: true, render: r => el("b", {}, bytes(r.total)) },
      { key: "upct", label: "Total used", num: true, render: r => meter(r.upct, "–") },
      { key: "members", label: "People", num: true },
      { key: "per", label: "Per person", num: true, render: r => bytes(r.per) },
      { key: "home_quota", label: "Home dirs (used / quota)", num: true, render: r => r.home_quota ? `${bytes(r.home_used)} / ${bytes(r.home_quota)}` : "–" },
      { key: "n_proj", label: "Project accts", num: true },
      { key: "is_pi", label: "Note", render: r => r.is_pi ? "" : "no matching Slurm account" },
    ], rs, { id: "storage-total", sortKey: "total", limit: 60 }));
  }
  redraw();
  const table = el("div", { class: "card" }, el("h2", {}, "Every lab"),
    el("p", { class: "sub" }, "Total = scratch limit + project filesystem size (1 TB = 10¹² bytes). People = everyone on the PI's main and project accounts; home directories are personal and not counted in the total. Project accts = the PI's project/condo (compute) accounts, for comparison."),
    el("div", { class: "filters" }, search, el("label", {}, flagChk, "Only nearly full or without a limit")), holder);
  return [intro, perUserCard("storage"), chart, table];
}

function vIssues() {
  const f = S.findings;
  if (!f || !f.findings || !f.findings.length) return el("p", { class: "muted" }, "The allocation review is computed a minute or two after the dashboard starts.");
  const out = [el("div", { class: "card" }, el("h2", {}, "Allocation issues to raise with ARCH"),
    el("p", { class: "sub" }, `Computed ${f.generated} from Slurm's configuration, accounting records and ARCH's quota files (refreshed every 6 hours). Terms are explained in the glossary at the bottom.`),
    el("ol", {}, f.findings.map(x => el("li", {}, el("a", { href: "#issues", onclick: ev => { ev.preventDefault(); document.getElementById("f-" + x.id).scrollIntoView({ behavior: "smooth" }); } }, x.title)))))];
  for (const x of f.findings) {
    const c = el("div", { class: "card finding " + x.severity, id: "f-" + x.id },
      el("h2", {}, x.title, " ", el("span", { class: "badge " + x.severity }, { high: "Important", medium: "Worth fixing", info: "For information" }[x.severity])),
      x.case ? [el("p", {}, PP_LEAD), el("p", {}, richText(x.paras[0])), ...perUserBody(x.case)] : x.paras.map(p => el("p", {}, richText(p))));
    for (const t of x.tables) {
      const cols = t.cols.map((label, i) => ({ key: i, label, num: (t.num || []).includes(i),
        sort: r => { const v = String(r[i]).replace(/[,%×]/g, "").match(/^-?[\d.]+/); return v ? +v[0] : String(r[i]); } }));
      c.append(detK(x.id + ":" + (t.caption || ""), `Show table${t.caption ? ": " + t.caption : ""} (${t.rows.length} rows)`, sortTable(cols, t.rows, { limit: 40 })));
    }
    out.push(c);
  }
  out.push(el("div", { class: "card", id: "glossary" }, el("h2", {}, "Glossary"),
    el("dl", { class: "gloss" }, f.glossary.flatMap(([k, v]) => [el("dt", {}, k), el("dd", {}, richText(v))]))));
  return out;
}

// ---------------------------------------------------------------------------
// boot
// ---------------------------------------------------------------------------
const themeBtn = $("#theme");
function applyTheme(t) {
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  themeBtn.textContent = "Theme: " + (t || "system");
}
applyTheme(store("skj_theme"));
themeBtn.addEventListener("click", () => {
  const cur = store("skj_theme") || "system";
  const nxt = { system: "light", light: "dark", dark: "system" }[cur];
  store("skj_theme", nxt); applyTheme(nxt === "system" ? null : nxt); render();
});
function codeFromHash() {
  const m = location.hash.match(/^#unlock=([\w-]+)/);
  if (!m) return null;
  history.replaceState(null, "", location.pathname + location.search + "#mylab");
  return m[1];
}
window.addEventListener("hashchange", () => {
  const code = PUBLIC ? codeFromHash() : null;
  S.tab = code ? "mylab" : location.hash.slice(1) || "overview"; renderTabs(); render();
  if (code) unlockLab(code, false);
});
if (PUBLIC) {
  const code = codeFromHash();
  if (code) { S.tab = "mylab"; S.ui.linkOpen = true; }
  S.labCode = code || store("skj_lab_code") || null;
}
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => S.tab === "overview" && render(), 200); });
renderTabs();
const ALL = ["status", "now", "slow", "findings", "hist", "spark", "alloc", "people", "lab"];
refresh(ALL);
// The server refreshes hourly (or when asked); the page only checks whether newer data exists.
let seen = null;
setInterval(async () => {
  try { S.status = await get(PUBLIC ? "/api/meta" : "/api/status"); } catch (e) { lastErr = e.message; }
  const stamp = PUBLIC ? S.status && S.status.generated : S.status && S.status.last_refresh;
  if (stamp && seen && stamp !== seen) refresh(ALL); else { $("#updated").textContent = statusLine(); renderBanner(); }
  seen = stamp || seen;
}, (PUBLIC ? 5 : 1) * 60e3);
setTimeout(() => { seen = PUBLIC ? S.status && S.status.generated : S.status && S.status.last_refresh; }, 5000);
$("#refreshBtn").textContent = PUBLIC ? "Check for update" : "Refresh now";
$("#refreshBtn").title = PUBLIC ? "Load the latest published numbers (the cluster publishes every hour)" : "Collect fresh numbers from Slurm now (and publish them)";
$("#refreshBtn").addEventListener("click", async () => {
  if (PUBLIC) { refresh(ALL); return; }
  try {
    const r = await get("/api/refresh");
    $("#updated").textContent = r.msg;
    const t0 = S.status && S.status.last_refresh;
    const poll = setInterval(async () => {
      S.status = await get("/api/status");
      if (S.status.last_refresh && S.status.last_refresh !== t0) { clearInterval(poll); seen = S.status.last_refresh; refresh(ALL); }
      else $("#updated").textContent = "Refreshing — collecting from Slurm (about a minute)…";
    }, 10e3);
  } catch (e) { $("#updated").textContent = "⚠ " + e.message; }
});
